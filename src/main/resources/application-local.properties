# ==================================
# BANCO PRINCIPAL - H2
# ==================================

spring.datasource.url=jdbc:h2:file:E:/SqlQuest/data/sqlquest
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==================================
# CONSOLE H2
# ==================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================================
# BANCO DO JOGADOR - H2
# ==================================

sqlquest.jogador.url=${spring.datasource.url}
sqlquest.jogador.username=jogador
sqlquest.jogador.password=sqlquest
sqlquest.jogador.driver=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none

# ==================================
# INICIALIZAÇÃO SQL
# ==================================

spring.sql.init.mode=never