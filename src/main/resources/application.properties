spring.application.name=SqlQuest
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}?currentSchema=jogo
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

sqlquest.jogador.url=${DB_URL}?currentSchema=reino
sqlquest.jogador.username=${DB_USER}
sqlquest.jogador.password=${DB_PASSWORD}
sqlquest.jogador.driver=org.postgresql.Driver

spring.sql.init.mode=never

spring.flyway.schemas=jogo,reino
spring.flyway.default-schema=jogo